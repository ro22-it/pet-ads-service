services:
  db:
    image: postgres:16
    container_name: pet-ads-db
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "1234"
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    container_name: pet-ads-api
    environment:
      PORT: "8080"
      DB_URL: jdbc:postgresql://db:5432/app
      DB_USER: postgres
      DB_PASSWORD: "1234"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
